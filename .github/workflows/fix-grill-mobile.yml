name: Fix Grill Me mobile layout

on:
  push:
    paths:
      - '.github/workflows/fix-grill-mobile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch prompt session persistence
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text()
          old = "const AUTOSAVE_KEY = 'pb_autosave';"
          if old not in text:
              raise SystemExit('AUTOSAVE_KEY declaration not found')

          old_set = "localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));"
          new_set = "sessionStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));"
          if old_set not in text:
              raise SystemExit('autosave write target not found')
          text = text.replace(old_set, new_set, 1)

          old_get = "const saved = JSON.parse(localStorage.getItem(AUTOSAVE_KEY));"
          new_get = "localStorage.removeItem(AUTOSAVE_KEY);\n    const saved = JSON.parse(sessionStorage.getItem(AUTOSAVE_KEY));"
          if old_get not in text:
              raise SystemExit('autosave restore target not found')
          text = text.replace(old_get, new_get, 1)
          app.write_text(text)
          PY

      - name: Commit prompt session fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: reset prompt autosave between sessions [skip ci]"
          git push
