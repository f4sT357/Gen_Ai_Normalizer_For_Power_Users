name: Refactor Grill Me responsibilities

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'refactor: separate Grill Me responsibilities')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          normal = root / 'normal-mode.js'
          free = root / 'free-api.js'
          index = root / 'index.html'

          n = normal.read_text()
          f = free.read_text()
          h = index.read_text()

          # Normal Mode owns the user-facing start action; provider code no longer owns it.
          n = re.sub(
              r"  function startNormalGrill\(\) \{.*?\n  \}\n\n  function wrapLanguageSwitch",
              '''  function startNormalGrill() {
              const input = document.getElementById('normal-intent');
              const task = document.getElementById('f-task');
              if (!input || !task) return;
              const intent = input.value.trim();
              if (!intent) {
                input.focus();
                return;
              }
              task.value = intent;
              update();
              if (typeof window.ganfpuStartGrill === 'function') {
                window.ganfpuStartGrill();
              } else {
                showToast('Grill Me is still loading. Try again in a moment.');
              }
            }

  function wrapLanguageSwitch''',
              n, flags=re.S)

          # Remove the LM-Studio-specific completion implementation from Normal Mode.
          n = re.sub(
              r"  function overrideApply\(\) \{.*?\n  \}\n\n  function init\(\)",
              '''  function overrideApply() {
    window.applyGrillMeResult = function () {
      if (typeof window.ganfpuApplyGrillResult === 'function') {
        return window.ganfpuApplyGrillResult();
      }
    };
  }

  function init()''',
              n, flags=re.S)
          normal.write_text(n)

          # Expose only the provider boundary needed by the Grill controller.
          marker = "  function init() {"
          bridge = """  function exposeLLMBridge() {
    window.ganfpuLLM = {
      request,
      ensureReady,
      getProviderLabel: () => currentProvider().label,
      getModel: () => getConfig().model,
    };
  }

"""
          if 'function exposeLLMBridge()' not in f:
              f = f.replace(marker, bridge + marker, 1)
          f = f.replace("    injectStyles();\n    createUI();", "    injectStyles();\n    createUI();\n    exposeLLMBridge();", 1)

          # Provider module no longer owns Grill Me DOM event handlers.
          f = re.sub(
              r"  function replaceNormalHandlers\(\) \{.*?\n  \}\n\n  function init\(\)",
              '''  function replaceNormalHandlers() {
    // Grill Me UI events are owned by grill-controller.js.
  }

  function init()''',
              f, flags=re.S)
          free.write_text(f)

          controller = root / 'grill-controller.js'
          controller.write_text(r'''// ============================================================
// GANFPU Grill Me controller
// Owns the Grill Me conversation UI and completion flow.
// Provider modules only expose an LLM request boundary.
// ============================================================

(() => {
  function el(id) {
    return document.getElementById(id);
  }

  function buildInitialConversation() {
    const draftPrompt = typeof getPromptText === 'function' ? getPromptText() || '' : '';
    const filledFields = {};
    const emptyFields = [];
    FIELDS.forEach((f) => {
      const val = typeof getFieldValue === 'function' ? getFieldValue(f.id) : '';
      const key = f.id.replace('f-', '');
      if (val) filledFields[key] = val;
      else emptyFields.push(key);
    });
    const systemPrompt = `You are an expert prompt engineer. Your job is to elicit requirements before producing a final prompt.\nRules:\n1. Identify the highest-value missing requirement.\n2. Never ask for information already supplied.\n3. Do not invent requirements or preferences.\n4. Ask only 1 or 2 short, targeted questions per turn.\n5. If the domain is specific, make the question domain-specific.\n6. Reply in the user's language. Current UI language: ${document.documentElement.lang || 'ja'}.`;
    const user = `Current prompt configuration:\n${JSON.stringify(filledFields, null, 2)}\n\nEmpty fields: ${emptyFields.join(', ')}\n\nPreview:\n---\n${draftPrompt}\n---\n\nAsk me 1 or 2 targeted questions to resolve the most important ambiguity.`;
    return [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: user },
    ];
  }

  async function getResponse() {
    const send = el('btn-grill-send');
    const input = el('grillInput');
    if (send) send.disabled = true;
    if (input) input.disabled = true;
    appendGrillMessage('system', 'Thinking...');
    try {
      const reply = await window.ganfpuLLM.request(grillMessages, 0.7);
      const log = el('grillChatLog');
      if (log?.lastChild?.textContent === 'Thinking...') log.removeChild(log.lastChild);
      grillMessages.push({ role: 'assistant', content: reply });
      appendGrillMessage('ai', reply);
    } catch (e) {
      const log = el('grillChatLog');
      if (log?.lastChild?.textContent === 'Thinking...') log.removeChild(log.lastChild);
      appendGrillMessage('system', `Error: ${e.message}`);
    } finally {
      if (send) send.disabled = false;
      if (input) input.disabled = false;
      requestAnimationFrame(() => {
        const log = el('grillChatLog');
        if (log) log.scrollTop = log.scrollHeight;
      });
    }
  }

  async function startGrill() {
    if (!window.ganfpuLLM) {
      showToast('LLM provider is still loading. Try again in a moment.');
      return;
    }
    if (!window.ganfpuLLM.ensureReady()) return;
    const input = el('normal-intent');
    const task = el('f-task');
    if (!input || !task || !input.value.trim()) {
      input?.focus();
      return;
    }
    task.value = input.value.trim();
    update();

    const modal = el('grillModal');
    if (modal) modal.style.display = 'flex';
    const chatLog = el('grillChatLog');
    if (chatLog) chatLog.innerHTML = '';
    const grillInput = el('grillInput');
    if (grillInput) {
      grillInput.value = '';
      grillInput.disabled = false;
    }

    grillMessages = buildInitialConversation();
    appendGrillMessage(
      'system',
      `Using ${window.ganfpuLLM.getProviderLabel()} · ${window.ganfpuLLM.getModel()}`,
    );
    await getResponse();
  }

  async function sendResponse() {
    const input = el('grillInput');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    appendGrillMessage('user', text);
    grillMessages.push({ role: 'user', content: text });
    input.value = '';
    await getResponse();
  }

  function showNormalResult() {
    const preview = el('preview');
    const result = el('normal-result');
    const wrap = el('normal-result-wrap');
    if (!preview || !result || !wrap) return;
    const text = preview.textContent.trim();
    if (!text || preview.querySelector('.preview-placeholder')) return;
    result.textContent = text;
    wrap.hidden = false;
  }

  function applyFields(parsed) {
    const ids = [
      'f-role',
      'f-task',
      'f-context',
      'f-constraint',
      'f-format',
      'f-tone',
      'f-length',
      'f-reasoning',
      'f-lang',
      'f-hallucination',
    ];
    ids.forEach((id) => {
      const value = typeof parsed[id] === 'string' ? parsed[id] : '';
      const field = el(id);
      if (!field) return;
      if (field.tagName === 'SELECT') {
        const has = Array.from(field.options).some((o) => o.value === value);
        if (has) field.value = value;
        else if (value) {
          field.value = 'custom';
          const custom = el(id + '-custom');
          if (custom) {
            custom.value = value;
            custom.style.display = 'block';
          }
        } else field.value = '';
      } else {
        field.value = value;
      }
    });
  }

  async function applyGrillResult() {
    if (!window.ganfpuLLM) return;
    if (!window.ganfpuLLM.ensureReady()) return;
    const chatLog = el('grillChatLog');
    appendGrillMessage('system', 'Structuring requirements into Prompt Specification...');
    const finalInstruct = `Based on our conversation, structure the final requirements into this JSON format. Output ONLY valid JSON, with every key present. Do not invent requirements: if the user never specified a value and it is not necessary to fulfill the task, use an empty string. Preserve concrete user requirements.\n{\n  "f-role": "", "f-task": "", "f-context": "", "f-constraint": "", "f-format": "", "f-tone": "", "f-length": "", "f-reasoning": "", "f-lang": "", "f-hallucination": ""\n}`;
    grillMessages.push({ role: 'user', content: finalInstruct });
    try {
      const reply = (await window.ganfpuLLM.request(grillMessages, 0.2)).trim();
      if (chatLog?.lastChild?.textContent.includes('Structuring requirements'))
        chatLog.removeChild(chatLog.lastChild);
      const match = reply.match(/\{[\s\S]*\}/);
      const parsed = JSON.parse(match ? match[0] : reply);
      applyFields(parsed);
      update();
      showNormalResult();
      if (typeof window.recordHistory === 'function') window.recordHistory('grill');
      closeGrillMe();
      const input = el('normal-intent');
      if (input) input.value = el('f-task')?.value || input.value;
      showToast('Prompt Specification updated from interview.');
    } catch (err) {
      console.error(err);
      if (chatLog?.lastChild?.textContent.includes('Structuring requirements'))
        chatLog.removeChild(chatLog.lastChild);
      appendGrillMessage('system', 'Failed to map the interview to structured fields.');
    }
  }

  function bind() {
    const send = el('btn-grill-send');
    const apply = el('btn-grill-apply');
    if (!send || !apply || !window.ganfpuLLM) return false;
    send.onclick = sendResponse;
    apply.onclick = applyGrillResult;
    window.applyGrillMeResult = applyGrillResult;
    return true;
  }

  function init() {
    if (bind()) return;
    setTimeout(init, 100);
  }

  window.ganfpuStartGrill = startGrill;
  window.ganfpuApplyGrillResult = applyGrillResult;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
''')

          # Load controller before provider; it waits for the provider bridge.
          if 'src="grill-controller.js"' not in h:
              needle = '<script src="normal-mode.js"></script>'
              h = h.replace(needle, needle + '\n<script src="grill-controller.js"></script>', 1)
          index.write_text(h)
          PY

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normal-mode.js free-api.js grill-controller.js index.html
          git commit -m "refactor: separate Grill Me responsibilities [skip ci]"
          git push

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/refactor-grill-responsibilities.yml
          git commit -m "chore: remove one-time refactor workflow [skip ci]"
          git push
