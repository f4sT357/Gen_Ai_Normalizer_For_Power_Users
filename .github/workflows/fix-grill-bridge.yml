name: Fix Grill Me bridge

on:
  push:
    paths:
      - '.github/workflows/fix-grill-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing LLM bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('free-api.js')
          s = p.read_text()
          marker = "  function init() {\n"
          bridge = "  function exposeLLMBridge() {\n    window.ganfpuLLM = {\n      request,\n      ensureReady,\n      getProviderLabel: () => currentProvider().label,\n      getModel: () => getConfig().model,\n    };\n  }\n\n"
          if 'function exposeLLMBridge()' not in s:
              if marker not in s:
                  raise SystemExit('init marker not found')
              s = s.replace(marker, bridge + marker, 1)
          old = "  function ensureReady() {\n    if (provider === 'lmstudio')\n      return !!(typeof selectedLMModel !== 'undefined' && selectedLMModel);"
          new = "  function ensureReady() {\n    if (provider === 'lmstudio') {\n      const ready = !!(typeof selectedLMModel !== 'undefined' && selectedLMModel);\n      if (!ready) showToast('Select an LM Studio model first.');\n      return ready;\n    }"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Format
        run: npx --yes prettier --write free-api.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add free-api.js
          git diff --cached --quiet || git commit -m 'fix: restore Grill Me LLM bridge [skip ci]'
          git push
