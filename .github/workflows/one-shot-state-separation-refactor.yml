name: one-shot-state-separation-refactor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refactor:
    if: "!contains(github.event.head_commit.message, 'separate Normal Mode and Grill Me state responsibilities')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('normal-mode.js')
          s = p.read_text()
          old = '''  function startNormalGrill() {
              const input = document.getElementById('normal-intent');
              const task = document.getElementById('f-task');
              if (!input || !task) return;
              const intent = input.value.trim();
              if (!intent) {
                input.focus();
                return;
              }
              task.value = intent;
              update();
              if (typeof window.ganfpuStartGrill === 'function') window.ganfpuStartGrill();
              else showToast('Grill Me is still loading. Try again in a moment.');
            }
          '''
          new = '''  function startNormalGrill() {
              const input = document.getElementById('normal-intent');
              if (!input) return;
              const intent = input.value.trim();
              if (!intent) {
                input.focus();
                return;
              }
              if (typeof window.ganfpuStartGrill === 'function') window.ganfpuStartGrill();
              else showToast('Grill Me is still loading. Try again in a moment.');
            }
          '''
          if old not in s:
              raise SystemExit('normal-mode start block not found')
          s = s.replace(old, new, 1)
          old = '''    setTimeout(() => {
              const input = document.getElementById('normal-intent');
              const task = document.getElementById('f-task');
              if (input && task && !input.value.trim() && task.value.trim())
                input.value = task.value.trim();
              updateModelStatus();
            }, 350);
          '''
          new = '''    setTimeout(() => {
              updateModelStatus();
            }, 350);
          '''
          if old not in s:
              raise SystemExit('normal-mode restore block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('free-api.js')
          s = p.read_text()
          start = s.index('  function buildInitialConversation() {')
          end = s.index('  function exposeLLMBridge() {', start)
          s = s[:start] + s[end:]
          old = '''    exposeLLMBridge();
              replaceNormalHandlers();
              // Keep the provider controls visible in Normal Mode; Power Mode remains LM Studio-native.
              window.ganfpuFreeApi = { startProviderGrill, sendProviderResponse, applyProviderResult };
          '''
          new = '''    exposeLLMBridge();
              // Grill Me behavior is owned by grill-controller.js.
          '''
          if old not in s:
              raise SystemExit('free-api init block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('grill-controller.js')
          s = p.read_text()
          old = """(() => {
              const el = (id) => document.getElementById(id);
          """
          new = """(() => {
              const el = (id) => document.getElementById(id);
              let grillMessages = [];
          """
          if old not in s:
              raise SystemExit('controller header not found')
          s = s.replace(old, new, 1)
          old = """      closeGrillMe();
              el('normal-intent').value = el('f-task')?.value || el('normal-intent').value;
              showToast('Prompt Specification updated from interview.');
          """
          new = """      closeGrillMe();
              showToast('Prompt Specification updated from interview.');
          """
          if old not in s:
              raise SystemExit('controller intent overwrite not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          replacements = [
              ('class="modal-close-btn" onclick="closeGrillMe()"', 'class="modal-close-btn"'),
              ('id="btn-grill-send"\n              onclick="sendGrillMeResponse()"', 'id="btn-grill-send"'),
              ('id="btn-grill-apply"\n            onclick="applyGrillMeResult()"', 'id="btn-grill-apply"'),
              ('id="btn-grill-close" onclick="closeGrillMe()"', 'id="btn-grill-close"'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'index replacement not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normal-mode.js free-api.js grill-controller.js index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: separate Normal Mode and Grill Me state responsibilities [skip ci]"
          git push
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-state-separation-refactor.yml
          git commit -m "chore: remove one-shot refactor workflow [skip ci]"
          git push
