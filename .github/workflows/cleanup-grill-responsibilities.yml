name: Cleanup Grill Me responsibilities

on:
  push:
    paths:
      - 'normal-mode.js'
      - '.github/workflows/cleanup-grill-responsibilities.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove duplicate dynamic loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          normal = Path('normal-mode.js')
          text = normal.read_text()
          pattern = r'\n// Load the optional browser-side provider module after Normal Mode exists\.\n\(\(\) => \{.*?\n\}\)\(\);\s*$'
          text, n = re.subn(pattern, '\n', text, flags=re.S)
          if n == 0:
              print('Dynamic loader already absent; nothing to remove.')
          else:
              normal.write_text(text)
          PY
      - name: Format changed file
        run: npx --yes prettier@3 --write normal-mode.js
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add normal-mode.js
          git commit -m 'refactor: remove duplicate Grill Me loader [skip ci]'
          git push
