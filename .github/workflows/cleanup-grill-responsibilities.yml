name: Cleanup Grill Me responsibilities

on:
  push:
    paths:
      - 'free-api.js'
      - 'normal-mode.js'
      - '.github/workflows/cleanup-grill-responsibilities.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove duplicate Grill Me implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          free = Path('free-api.js')
          text = free.read_text()
          text, n = re.subn(
              r'\n  function buildInitialConversation\(\) \{.*?\n  function exposeLLMBridge\(\)',
              '\n  function exposeLLMBridge()',
              text,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected one old Grill Me block, found {n}')
          text, n = re.subn(
              r'\n    window\.ganfpuFreeApi = \{ startProviderGrill, sendProviderResponse, applyProviderResult \};',
              '\n    window.ganfpuFreeApi = { request, ensureReady };',
              text,
          )
          if n != 1:
              raise SystemExit(f'Expected one old export, found {n}')
          free.write_text(text)

          normal = Path('normal-mode.js')
          text = normal.read_text()
          text, n = re.subn(
              r'\n// Load the optional browser-side provider module after Normal Mode exists\.\n\(\(\) => \{.*?\n\}\)\(\);\s*$',
              '\n',
              text,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected one duplicate dynamic loader, found {n}')
          normal.write_text(text)
          PY
      - name: Format changed files
        run: npx --yes prettier@3 --write free-api.js normal-mode.js
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add free-api.js normal-mode.js
          git commit -m 'refactor: remove duplicate Grill Me implementation [skip ci]'
          git push
